# .github/workflows/pages.yml

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh versions.json
        run: bash hooks/fetch-versions.sh

      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- similar.json static/versions.json && \
             [[ -z "$(git ls-files --others --exclude-standard -- similar.json static/versions.json)" ]]; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          git add static/versions.json
          git commit -m "chore: regenerate versions.json [skip ci]"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            [[ $i -eq 3 ]] && { echo "push failed after 3 attempts" >&2; exit 1; }
            git pull --rebase origin main
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
