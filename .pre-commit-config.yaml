# .pre-commit-config.yaml

exclude: '(^|/)(dump|secrets)(/|$)|(^|/)\.env($|\.)'

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: '^(docs/|dist/|vendor/|.*\.snap$)'
      - id: end-of-file-fixer
        exclude: '^(docs/|dist/|vendor/|.*\.snap$)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict

  - repo: local
    hooks:

      - id: move-posts-json
        name: Move posts.json to webroot
        entry: bash hooks/move-posts-json.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: build-similar
        name: Build similar.json
        entry: bash hooks/build-similar.sh
        language: system
        pass_filenames: false
        always_run: false



  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: pretty-format-json
