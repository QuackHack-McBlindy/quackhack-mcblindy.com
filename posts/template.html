        .reveal {

        .reveal.in {

        }
        .anim {
            opacity: 0;
            transform: translateY(100px);
            transition:
                opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.5s ease;
            filter: blur(3px);
            will-change: opacity, transform, filter;
        }
        .anim.in-view {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .glitch {
            animation: glitch 3s linear infinite;
        }
        @keyframes glitch {
            0%,
            4%,
            8%,
            12%,
            100% {
                filter: none;
            }
            1%,
            5%,
            9% {
                filter: url(#f1);
            }
        }
        .hue-shift {
            animation: hueshift 45s ease-in-out infinite;
        }
        @keyframes hueshift {
            0%,
            50% {
                filter: hue-rotate(0deg);
            }
            60% {
                filter: hue-rotate(360deg);
            }
            70% {
                filter: hue-rotate(0deg);
            }
            80% {
                filter: hue-rotate(360deg);
            }
            90% {
                filter: hue-rotate(0deg);
            }
            100% {
                filter: hue-rotate(360deg);
            }
        }

    <script>
        function timeSince(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = Math.floor(seconds / 31536000);
            if (interval > 1) return interval + ' years ago';
            interval = Math.floor(seconds / 2592000);
            if (interval > 1) return interval + ' months ago';
            interval = Math.floor(seconds / 86400);
            if (interval > 1) return interval + ' days ago';
            interval = Math.floor(seconds / 3600);
            if (interval > 1) return interval + ' hours ago';
            interval = Math.floor(seconds / 60);
            if (interval > 1) return interval + ' minutes ago';
            return 'just now';
        }

        document.getElementById('year').textContent = new Date().getFullYear();

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in', 'in-view');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('.reveal, .anim').forEach(el => observer.observe(el));

        async function loadHardwareGallery() {
            const gallery = document.getElementById('hardware-gallery');
            if (!gallery) return;

            try {
                const res = await fetch('../static/pics/hardware/media.json');
                if (!res.ok) throw new Error('Failed to load media manifest');
                const media = await res.json();

                if (!media.length) {
                    gallery.innerHTML = '<p style="text-align:center;color:var(--muted);">No hardware media yet.</p>';
                    return;
                }

                let currentIndex = 0;
                let lightbox = document.querySelector('.lightbox');
                if (!lightbox) {
                    lightbox = document.createElement('div');
                    lightbox.className = 'lightbox';
                    lightbox.innerHTML = `
                        <button class="lightbox-close" aria-label="Close">×</button>
                        <div class="lightbox-content">
                            <div class="lightbox-media"></div>
                            <div class="lightbox-caption"></div>
                        </div>
                    `;
                    document.body.appendChild(lightbox);
                }
                const mediaContainer = lightbox.querySelector('.lightbox-media');
                const captionEl = lightbox.querySelector('.lightbox-caption');

                function showMedia(index) {
                    const item = media[index];
                    if (!item) return;
                    currentIndex = index;
                    mediaContainer.innerHTML = '';
                    if (item.type === 'image') {
                        const img = document.createElement('img');
                        img.src = `../static/pics/hardware/${item.src}`;
                        img.alt = item.caption || '';
                        mediaContainer.appendChild(img);
                    } else {
                        const video = document.createElement('video');
                        video.src = `../static/pics/hardware/${item.src}`;
                        video.controls = true;
                        video.autoplay = true;
                        mediaContainer.appendChild(video);
                    }
                    captionEl.textContent = item.caption || '';
                    lightbox.classList.add('active');
                }

                function closeLightbox() {
                    lightbox.classList.remove('active');
                    mediaContainer.innerHTML = '';
                }

                gallery.innerHTML = media.map((item, i) => `
                    <div class="hw-item" data-index="${i}">
                        ${item.type === 'image'
                            ? `<img src="../static/pics/hardware/${item.thumb || item.src}" alt="${escapeAttr(item.caption || '')}" loading="lazy">`
                            : `<video src="../static/pics/hardware/${item.src}" muted preload="metadata"></video>`
                        }
                        ${item.caption ? `<div class="hw-caption">${escapeHTML(item.caption)}</div>` : ''}
                    </div>
                `).join('');

                gallery.querySelectorAll('.hw-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const index = parseInt(el.dataset.index, 10);
                        showMedia(index);
                    });
                });

                lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) {
                        closeLightbox();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('active')) return;

                    if (e.key === 'Escape') {
                        closeLightbox();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        currentIndex = (currentIndex - 1 + media.length) % media.length;
                        showMedia(currentIndex);
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        currentIndex = (currentIndex + 1) % media.length;
                        showMedia(currentIndex);
                    }
                });

            } catch (err) {
                console.error('Hardware gallery error:', err);
                gallery.innerHTML = '<p style="text-align:center;color:var(--muted);">Could not load hardware media.</p>';
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        loadHardwareGallery();
    </script>
</body>
</html>
