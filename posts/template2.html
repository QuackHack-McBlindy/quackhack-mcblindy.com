    <script>
        function timeSince(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = Math.floor(seconds / 31536000);
            if (interval > 1) return interval + ' years ago';
            interval = Math.floor(seconds / 2592000);
            if (interval > 1) return interval + ' months ago';
            interval = Math.floor(seconds / 86400);
            if (interval > 1) return interval + ' days ago';
            interval = Math.floor(seconds / 3600);
            if (interval > 1) return interval + ' hours ago';
            interval = Math.floor(seconds / 60);
            if (interval > 1) return interval + ' minutes ago';
            return 'just now';
        }

        document.getElementById('year').textContent = new Date().getFullYear();

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in', 'in-view');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('.reveal, .anim').forEach(el => observer.observe(el));

        (function initSkillRows() {
            const grid = document.querySelector('.skills-grid');
            if (!grid) return;

            const items = Array.from(grid.querySelectorAll('.skill-item'));

            function groupByRow() {
                const rows = new Map();
                items.forEach(el => {
                    const top = Math.round(el.offsetTop);
                    if (!rows.has(top)) rows.set(top, []);
                    rows.get(top).push(el);
                });
                return Array.from(rows.values());
            }

            let rowObserver = null;

            function attach() {
                if (rowObserver) rowObserver.disconnect();
                rowObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const rowItems = entry.target._rowItems;
                        if (entry.isIntersecting) {
                            rowItems.forEach(el => el.classList.add('in-view'));
                        } else {
                            rowItems.forEach(el => el.classList.remove('in-view'));
                        }
                    });
                }, {
                    threshold: 0.05,
                    rootMargin: '0px 0px -180px 0px'
                });

                groupByRow().forEach(rowItems => {
                    const anchor = rowItems[0];
                    anchor._rowItems = rowItems;
                    rowObserver.observe(anchor);
                });
            }

            attach();

            let raf;
            window.addEventListener('resize', () => {
                cancelAnimationFrame(raf);
                raf = requestAnimationFrame(attach);
            });
        })();

        (async function () {
          const section = document.getElementById('similar-posts');
          const list    = document.getElementById('similar-posts-list');
          const myLink  = document.body.dataset.postLink;
          if (!section || !list || !myLink) return;

          try {
            const [simRes, postsRes] = await Promise.all([
              fetch('/similar.json', { cache: 'no-cache' }),
              fetch('/posts.json',   { cache: 'no-cache' })
            ]);
            if (!simRes.ok || !postsRes.ok) return;

            const similar = await simRes.json();
            const posts   = await postsRes.json();
            const links   = similar[myLink] || [];
            if (!links.length) return;

            const byLink = new Map(posts.map(p => [p.link, p]));

            list.innerHTML = links.map(link => {
              const p = byLink.get(link);
              if (!p) return '';
              return `
                <a class="similar-post" href="${escAttr(link)}">
                  <h4>${esc(p.title)}</h4>
                  <p>${esc(p.description)}</p>
                </a>
              `;
            }).join('');

            section.hidden = false;
          } catch (e) {
            console.warn('[similar-posts]', e);
          }

          function esc(s) {
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
          }
          function escAttr(s) {
            return String(s).replace(/"/g, '&quot;');
          }
        })();
    </script>
