    <style>
        :root {
            --bg: #050707;
            --panel: #0b1110;
            --panel2: #0e1716;
            --teal: #11e6d2;
            --teal2: #05a99f;
            --gold: #f4b52f;
            --gold2: #ffdc72;
            --text: #f3fffd;
            --muted: #8ea6a3;
            --line: rgba(17, 230, 210, .16);
            --max: 1180px;
            --frame-header-h: 260px;
            --frame-bottom-h: 64px;
            --frame-left-w: 190px;
            --frame-right-w: 196px;
            --frame-z: 10000;
            --mask-left-w: 214px;
            --mask-right-w: 214px;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 50% -10%, rgba(0, 221, 204, .10), transparent 34rem),
                radial-gradient(circle at 90% 45%, rgba(244, 181, 47, .07), transparent 28rem),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 80%, rgba(17, 230, 210, .08), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(244, 181, 47, .08), transparent 40%);
            animation: aurora 20s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes aurora {
            0%   { opacity: .5; transform: scale(1); }
            100% { opacity: 1;  transform: scale(1.15); }
        }

        a { color: inherit; text-decoration: none; }

        .wrap {
            width: min(calc(100vw - var(--mask-left-w) - var(--mask-right-w) - 40px), var(--max));
            margin: auto;
        }

        .gold  { color: var(--gold); }
        .white { color: #fff; }
        .muted { color: var(--muted); }

        .duckhawk-frame {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: var(--frame-z);
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        .frame-piece {
            position: fixed;
            display: block;
            pointer-events: none;
            user-select: none;
            max-width: none;
        }
        .frame-header {
            top: 0; left: 0;
            width: 100vw;
            height: var(--frame-header-h);
            object-fit: fill;
        }
        .frame-left {
            top: var(--frame-header-h); left: 0;
            width: var(--frame-left-w);
            height: calc(100vh - var(--frame-header-h) - var(--frame-bottom-h));
            object-fit: fill;
        }
        .frame-right {
            top: var(--frame-header-h); right: 0;
            width: var(--frame-right-w);
            height: calc(100vh - var(--frame-header-h) - var(--frame-bottom-h));
            object-fit: fill;
        }
        .frame-bottom {
            left: 0; bottom: 0;
            width: 100vw;
            height: var(--frame-bottom-h);
            object-fit: fill;
        }

        .frame-navigation {
            position: fixed;
            inset: 0 0 auto 0;
            width: 100vw;
            height: var(--frame-header-h);
            z-index: calc(var(--frame-z) + 1);
            pointer-events: none;
            display: none;
        }
        .frame-nav-link {
            position: absolute;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            color: #f4df9a;
            font-family: "Cinzel Decorative", Georgia, serif;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, .95),
                0 0 12px rgba(17, 230, 210, .35);
            transition: color .25s ease, transform .25s ease, text-shadow .25s ease;
        }
        .frame-nav-home     { left: 25%; top: 140px; transform: translate(-50%, -50%); }
        .frame-nav-showcase { left: 75%; top: 140px; transform: translate(-50%, -50%); }
        .frame-nav-link::after {
            content: "";
            position: absolute;
            left: 15%; right: 15%; bottom: 3px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--teal), transparent);
            opacity: .65;
            transform: scaleX(.35);
            transition: transform .25s ease, opacity .25s ease;
        }
        .frame-nav-link:hover {
            color: #fff5cf;
            transform: translate(-50%, -50%) translateY(-2px);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 1), 0 0 18px rgba(17, 230, 210, .65);
        }
        .frame-nav-link:hover::after { opacity: 1; transform: scaleX(1); }

        .mobile-nav {
            display: none;
            justify-content: center;
            gap: 10px;
            padding: 12px 14px;
            background: linear-gradient(180deg, #0b1110, #050707);
            border-bottom: 1px solid var(--line);
        }

            padding: 8px 16px;
            border-radius: 10px;
            color: var(--gold);
            font-family: "Cinzel Decorative", Georgia, serif;
            font-weight: 700;
            letter-spacing: .06em;
        }
        .mobile-nav a:hover { background: rgba(17, 230, 210, .1); color: var(--gold2); }

        @media (min-width: 1200px) and (min-height: 700px) {
            .duckhawk-frame,
            .frame-navigation { display: block; }
        }

            position: absolute;

        .hardware-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;

        .hw-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .08);

            font: inherit;
            color: inherit;
            text-align: inherit;

            border-color: rgba(17, 230, 210, .4);

        .hw-item:focus-visible {
            box-shadow: 0 0 0 2px rgba(17, 230, 210, .4);

        .hw-item img,

            width: 100%;

        .hw-item .hw-caption {
            padding: 8px 12px;
            font-size: .9rem;
            color: var(--muted);
            text-align: center;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
            font-size: .95rem;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lightbox-media img,
        .lightbox-media video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .5);
            display: block;

        .lightbox-caption {
            margin-top: 12px;
            color: #ddd;
            font-size: 1rem;
            text-align: center;
            max-width: 80vw;
        }
        .lightbox-close {
            position: absolute;

            font-size: 2rem;

            background: none;

            border-radius: 8px;

        }

        #similar-posts {
            margin-top: 70px;
            padding-top: 40px;
            border-top: 1px solid var(--line);
        }
        #similar-posts h2 {
            font-family: "Cinzel Decorative", Georgia, serif;
            font-size: clamp(1.3rem, 3vw, 1.9rem);
            margin: 0 0 22px;
            color: var(--text);
            letter-spacing: -.01em;

        }
        #similar-posts-list {
            display: grid;
            gap: 14px;

        }
        .similar-post {
            display: block;
            padding: 18px 20px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
            transition: transform .2s ease, border-color .2s ease;
        }
        .similar-post:hover {
            transform: translateY(-2px);
            border-color: rgba(17, 230, 210, .3);
        }
        .similar-post h4 {
            margin: 0 0 6px;
            color: var(--text);

        }
        .similar-post p {
            margin: 0;
            color: var(--muted);
            font-size: .88rem;
            line-height: 1.5;
        }

        .reveal {
            opacity: 0;
            transform: translateY(22px);
            transition: .7s ease;
        }
        .reveal.in { opacity: 1; transform: none; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }
            .reveal { opacity: 1; transform: none; }
            body::before { animation: none; opacity: .6; }
            .glitch, .hue-shift { animation: none !important; }
        }

        .glitch { animation: glitch 3s linear infinite; }
        @keyframes glitch {
            0%, 4%, 8%, 12%, 100% { filter: none; }
            1%, 5%, 9% { filter: url(#f1); }
        }
        .hue-shift { animation: hueshift 45s ease-in-out infinite; }
        @keyframes hueshift {
            0%, 50%  { filter: hue-rotate(0deg); }
            60%      { filter: hue-rotate(360deg); }
            70%      { filter: hue-rotate(0deg); }
            80%      { filter: hue-rotate(360deg); }
            90%      { filter: hue-rotate(0deg); }
            100%     { filter: hue-rotate(360deg); }
        }

        footer {
            padding: 26px 0 34px;

            display: flex;
            justify-content: space-between;

        .footer-links a {

        @media (max-width: 850px) {

                --frame-left-w: 105px;
                --frame-right-w: 108px;
            }
            header { min-height: 150px; }
            .frame-nav-link {
                font-size: 17px;
                letter-spacing: .08em;
                padding: 8px 10px;
            }
            .frame-nav-home     { left: 24%; top: 78px; }
            .frame-nav-showcase { left: 76%; top: 78px; }
        }
        @media (max-width: 560px) {
            :root {
                --frame-header-h: 145px;
                --frame-bottom-h: 38px;
                --frame-left-w: 72px;
                --frame-right-w: 74px;
            }
            .wrap { width: min(calc(100% - 28px), var(--max)); }
            header { min-height: 120px; }
            .frame-nav-link {
                font-size: 14px;
                letter-spacing: .06em;
                padding: 7px 6px;
            }
            .frame-nav-home     { left: 23%; top: 61px; }
            .frame-nav-showcase { left: 77%; top: 61px; }
        }
    </style>

    <script>
    (function () {
        'use strict';

        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function escapeAttr(str) {
            return escapeHTML(str).replace(/"/g, '&quot;');
        }

        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        if ('IntersectionObserver' in window) {
            const io = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
            document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
        } else {
            document.querySelectorAll('.reveal').forEach((el) => el.classList.add('in'));
        }

        const lightbox = document.createElement('div');
        lightbox.className = 'lightbox';
        lightbox.setAttribute('role', 'dialog');
        lightbox.setAttribute('aria-modal', 'true');
        lightbox.setAttribute('aria-label', 'Media viewer');
        lightbox.innerHTML = `
            <button class="lightbox-close" type="button" aria-label="Close viewer">×</button>
            <div class="lightbox-content">
                <div class="lightbox-media"></div>
                <div class="lightbox-caption"></div>
            </div>
        `;
        document.body.appendChild(lightbox);

        const mediaContainer = lightbox.querySelector('.lightbox-media');
        const captionEl = lightbox.querySelector('.lightbox-caption');
        const closeBtn = lightbox.querySelector('.lightbox-close');

        let currentIndex = 0;
        let mediaList = [];
        let lastFocused = null;

        function renderMedia(index) {
            const item = mediaList[index];
            if (!item) return;
            currentIndex = index;
            mediaContainer.innerHTML = '';

            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = `/static/pics/hardware/${item.src}`;
                img.alt = item.caption || '';
                mediaContainer.appendChild(img);
            } else {
                const video = document.createElement('video');
                video.src = `/static/pics/hardware/${item.src}`;
                video.controls = true;
                video.autoplay = true;
                video.muted = false;
                mediaContainer.appendChild(video);
            }

            captionEl.textContent = item.caption || '';
        }

        function openLightbox(index) {
            lastFocused = document.activeElement;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderMedia(index);
            closeBtn.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            mediaContainer.innerHTML = '';
            if (lastFocused && typeof lastFocused.focus === 'function') {
                lastFocused.focus();
            }
            lastFocused = null;
        }

        closeBtn.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;

            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                renderMedia((currentIndex - 1 + mediaList.length) % mediaList.length);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                renderMedia((currentIndex + 1) % mediaList.length);
            } else if (e.key === 'Tab') {
                const focusable = lightbox.querySelectorAll('button, [href], video, [tabindex]:not([tabindex="-1"])');
                if (!focusable.length) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

        async function loadHardwareGallery() {
            const gallery = document.getElementById('hardware-gallery');
            if (!gallery) return;

            try {
                const res = await fetch('/static/pics/hardware/media.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const media = await res.json();
                mediaList = Array.isArray(media) ? media : [];

                if (mediaList.length === 0) {
                    gallery.innerHTML = '<div class="gallery-empty">No hardware media yet.</div>';
                    return;
                }

                gallery.innerHTML = mediaList.map((item, i) => {
                    const thumbSrc = `/static/pics/hardware/${item.thumb || item.src}`;
                    const fullSrc  = `/static/pics/hardware/${item.src}`;
                    const altText  = escapeAttr(item.caption || '');
                    const mediaEl  = item.type === 'image'
                        ? `<img src="${escapeAttr(thumbSrc)}" alt="${altText}" loading="lazy">`
                        : `<video src="${escapeAttr(fullSrc)}" muted preload="metadata" aria-label="${altText}"></video>`;
                    const captionEl = item.caption
                        ? `<div class="hw-caption">${escapeHTML(item.caption)}</div>`
                        : '';
                    return `
                        <button class="hw-item" type="button" data-index="${i}" aria-label="View ${altText || 'media'}">
                            ${mediaEl}
                            ${captionEl}
                        </button>
                    `;
                }).join('');

                gallery.querySelectorAll('.hw-item').forEach((el) => {
                    el.addEventListener('click', () => {
                        const index = parseInt(el.dataset.index, 10);
                        if (!Number.isNaN(index)) openLightbox(index);
                    });
                });

            } catch (err) {
                console.error('Hardware gallery error:', err);
                gallery.innerHTML = '<div class="gallery-empty">Could not load hardware media.</div>';
            }
        }

        loadHardwareGallery();

        (async function loadSimilarPosts() {
            const section = document.getElementById('similar-posts');
            const list    = document.getElementById('similar-posts-list');
            const myLink  = document.body.dataset.postLink;
            if (!section || !list || !myLink) return;

            try {
                const [simRes, postsRes] = await Promise.all([
                    fetch('/similar.json', { cache: 'no-cache' }),
                    fetch('/posts.json',   { cache: 'no-cache' })
                ]);
                if (!simRes.ok || !postsRes.ok) return;

                const similar = await simRes.json();
                const posts   = await postsRes.json();
                const links   = similar[myLink] || [];
                if (!links.length) return;

                const byLink = new Map(posts.map((p) => [p.link, p]));

                const cards = links.map((link) => {
                    const p = byLink.get(link);
                    if (!p) return '';
                    return `
                        <a class="similar-post" href="${escapeAttr(link)}">
                            <h4>${escapeHTML(p.title)}</h4>
                            <p>${escapeHTML(p.description)}</p>
                        </a>
                    `;
                }).filter(Boolean).join('');

                if (!cards) return;

                list.innerHTML = cards;
                section.hidden = false;

            } catch (err) {
                console.warn('Similar posts error:', err);
            }
        })();
    })();
    </script>
</body>
</html>
